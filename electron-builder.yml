# Installer configuration (electron-builder). Build with: npm run dist (or dist:win / dist:mac / dist:linux)
appId: org.fartcrobat.app
productName: Fartcrobat
copyright: Copyright © 2026 Fartcrobat contributors. Licensed under the GNU AGPL v3 or later.
directories:
  output: release
  buildResources: build
files:
  - out/**
  - resources/**
  - package.json
  - '!**/*.map'
  # The renderer, preload and main bundles contain all code (electron.vite.config.ts bundles
  # every dependency; only Electron and Node built-ins are external), so node_modules is not needed.
  - '!node_modules/**'
  # The agent helper (npm run build:agent) ships as the two plain files below, not in app.asar.
  - '!out/agent/**'
# Next to app.asar: the Claude Desktop extension, which the system opens (Preferences > AI apps >
# Add to Claude Desktop), and the MCP helper that AI apps set up by hand run with Node (Connect
# ChatGPT Desktop; the app gives them a copy in userData, src/features/agent-access/main/helperCopy.ts).
extraResources:
  - from: out/agent/fartcrobat.mcpb
    to: agent/fartcrobat.mcpb
  - from: out/agent/shim.mjs
    to: agent/shim.mjs
asar: true
asarUnpack:
  - resources/**
# Where in-app updates come from (docs/features/updates.md): builds write resources/app-update.yml
# and release/latest*.yml (with .blockmap files) for electron-updater. Builds never upload anything
# themselves (the release workflow runs them with --publish never and attaches the files).
publish:
  provider: github
  owner: normiecore
  repo: Fartcrobat
  releaseType: release
# File associations are per platform: on Windows the name is the registry ProgId, which must be
# unique to Fartcrobat (src/main/util/systemDefaults.ts WINDOWS_PROG_ID checks it to tell whether
# Fartcrobat is the default PDF app); on macOS it is the document type's display name.
win:
  fileAssociations:
    - ext: pdf
      name: Fartcrobat.Document
      description: PDF Document
      icon: pdf-document
  target:
    - target: nsis
      arch: [x64, arm64]
  icon: build/icon.ico
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}
# One file per kind of computer (scripts/release-downloads.mjs checks each build against the table
# in README.md and the release notes): installers for x64 and for arm64, not also one for both. An
# install keeps the installer it ran for its next update's differential download, which only
# matches when it is the file the updater picks for its processor.
nsis:
  buildUniversalInstaller: false
  # build/installer.nsh registers Fartcrobat under Default apps (RegisteredApplications).
  include: build/installer.nsh
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Fartcrobat
  license: build/license.txt
  runAfterFinish: true
  deleteAppDataOnUninstall: false
mac:
  fileAssociations:
    - ext: pdf
      name: PDF Document
      description: PDF Document
      mimeType: application/pdf
      role: Editor
      rank: Default
      icon: pdf-document
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  category: public.app-category.productivity
  icon: build/icon.png
  # The processor in every name: x64 (Intel) or arm64 (Apple silicon). The .zip is for updates.
  artifactName: ${productName}-${version}-${arch}-mac.${ext}
  darkModeSupport: true
  # Ad-hoc signed by default ("-"): unsigned apps that electron-builder modified are reported as
  # "damaged" on Apple Silicon, while ad-hoc signed ones get the normal "Open Anyway" path. The
  # release workflow signs with a real Developer ID when the CSC_LINK secret is set.
  identity: '-'
  hardenedRuntime: false
  extendInfo:
    NSHumanReadableCopyright: Fartcrobat is free software under the GNU AGPL v3 or later.
dmg:
  title: Fartcrobat ${version}
  artifactName: ${productName}-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
    - deb
    - tar.gz
  category: Office
  icon: build/icons
  executableName: fartcrobat
  syncDesktopName: true
  synopsis: PDF reader, editor and signer
  description: Free, open-source PDF reader, editor and signer for people coming from Adobe Acrobat Pro.
  mimeTypes:
    - application/pdf
  desktop:
    entry:
      Name: Fartcrobat
      GenericName: PDF Editor
      Comment: Read, edit, comment on and sign PDF documents
      Keywords: pdf;acrobat;reader;editor;sign;forms;
      StartupWMClass: Fartcrobat
  maintainer: Fartcrobat contributors <noreply@fartcrobat.org>
# No version in the AppImage's file name: an in-app update then replaces the file in place, so the
# desktop entry and launchers that start it keep working. (electron-updater gives a file with a
# version in its name the new version's name and deletes the old one; src/features/updates follows
# that rename for files people renamed themselves.)
appImage:
  artifactName: ${productName}-${arch}.${ext}
deb:
  priority: optional
