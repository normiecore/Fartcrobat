name: Release

# Builds installers for Windows, macOS and Linux. Run it manually to only build them. To publish
# a GitHub release with the installers attached, either run it manually on main with a version
# (the tag v<version> is created on the commit it built), or push a tag like v0.2.0. To write the
# release notes on GitHub first, save the release as a draft (do not publish it), run this
# workflow, and publish the draft once the installers are attached: installed copies offer the
# latest published release as soon as it exists.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Publish as this version, e.g. 0.2.0 (must match package.json; runs on main only). Leave empty to only build.
        required: false
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac
          - os: ubuntu-24.04
            script: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build installers
        # macOS builds are ad-hoc signed (electron-builder.yml) unless a Developer ID certificate
        # is provided in CSC_LINK: then an empty identity lets electron-builder find and use it.
        # A missing secret arrives as an empty variable, which electron-builder takes as a
        # certificate path ("... not a file"), so the signing variables are dropped when empty.
        shell: bash
        run: |
          [ -n "$CSC_LINK" ] || unset CSC_LINK CSC_KEY_PASSWORD
          npm run ${{ matrix.script }} -- --publish never ${{ matrix.os == 'macos-latest' && secrets.CSC_LINK != '' && '-c.mac.identity=' || '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional code signing: add these secrets to sign installers.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      - name: Smoke-test the packaged app
        # Opens, renders, searches and runs OCR in the packaged build (no node_modules, asar).
        if: matrix.os == 'ubuntu-24.04'
        run: xvfb-run -a npx playwright test tests/e2e/smoke.spec.ts tests/e2e/ocr.spec.ts
        env:
          FARTCROBAT_EXECUTABLE: release/linux-unpacked/fartcrobat
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          # latest*.yml and the .blockmap files are what in-app updates read (electron-updater):
          # latest.yml (Windows), latest-mac.yml, latest-linux.yml. builder-debug.yml and
          # builder-effective-config.yaml stay behind.
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.tar.gz
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the GitHub release (or add the installers to it)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', inputs.version) }}
        run: |
          set -euo pipefail
          # The installers carry the version from package.json: the tag must say the same.
          expected="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$expected" ]; then
            echo "::error::$TAG does not match the version in package.json ($expected)"
            exit 1
          fi
          # Installed copies update from these files: a release without them strands everyone on
          # the version before it (docs/features/updates.md, U5).
          for meta in latest.yml latest-mac.yml latest-linux.yml; do
            if [ ! -f "dist/$meta" ]; then
              echo "::error::dist/$meta is missing: in-app updates need it. Check the build job for that platform."
              exit 1
            fi
          done
          if ! ls dist/*.blockmap >/dev/null 2>&1; then
            echo "::error::No .blockmap files were built: in-app updates need them for differential downloads."
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Made on GitHub first (Releases > Draft a new release, Save draft): attach the
            # installers. Only to a draft: installed copies already offer a published release, and
            # --clobber replaces its files one at a time, so latest*.yml could name installers that
            # are missing or from another build while it runs.
            draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
            if [ "$draft" != "true" ]; then
              echo "::error::Release $TAG is already published, so installed copies already offer it. Make it a draft again (Edit release > Save draft) and re-run this job, or delete the release and re-run to create it."
              exit 1
            fi
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            echo "::notice::The installers are attached to the draft release $TAG. Publish it on GitHub when it is ready."
          else
            # A manual run creates the tag on the commit it built.
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Fartcrobat $TAG" --generate-notes
          fi
