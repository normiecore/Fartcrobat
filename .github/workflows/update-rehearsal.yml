name: Update rehearsal

# The newest release updates itself to a build of the next version, on Linux (AppImage) and Windows
# (installed per user and per machine), from a fake GitHub. See tests/update-rehearsal/README.md.
# Nothing is published: the fake answers for github.com inside each runner.
on:
  workflow_dispatch:
    inputs:
      old:
        description: 'Released version to update from (default: the latest release)'
        required: false
      new:
        description: 'Version the rehearsal build gets (default: the next patch version)'
        required: false
  push:
    paths:
      - 'tests/update-rehearsal/**'
      - '.github/workflows/update-rehearsal.yml'
      - 'src/features/updates/**'

concurrency:
  group: update-rehearsal-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-24.04
    outputs:
      old: ${{ steps.v.outputs.old }}
      new: ${{ steps.v.outputs.new }}
    steps:
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          OLD: ${{ inputs.old }}
          NEW: ${{ inputs.new }}
        run: |
          [ -n "$OLD" ] || OLD=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName | sed 's/^v//')
          [ -n "$NEW" ] || NEW=$(echo "$OLD" | awk -F. '{ printf "%d.%d.%d", $1, $2, $3 + 1 }')
          echo "Rehearsal: $OLD -> $NEW"
          echo "old=$OLD" >> "$GITHUB_OUTPUT"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"

  linux:
    needs: versions
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb libnss3-tools
      - run: npm ci
      - name: Rehearse the AppImage update
        run: sudo env "PATH=$PATH" REHEARSAL_WORK="$RUNNER_TEMP/rehearsal" tests/update-rehearsal/linux.sh --old "${{ needs.versions.outputs.old }}" --new "${{ needs.versions.outputs.new }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rehearsal-linux
          path: ${{ runner.temp }}/rehearsal/out/
          retention-days: 14

  windows-build:
    needs: versions
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The next version, built as the release workflow builds it, with only the version changed.
      - run: npm run dist:win -- --publish never "-c.extraMetadata.version=${{ needs.versions.outputs.new }}" "-c.directories.output=build-new"
      - uses: actions/upload-artifact@v4
        with:
          name: rehearsal-windows-build
          path: |
            build-new/latest.yml
            build-new/*.exe
            build-new/*.blockmap
          retention-days: 3

  windows:
    needs: [versions, windows-build]
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { scope: user, scenario: restart }
          - { scope: user, scenario: later }
          - { scope: user, scenario: policy }
          - { scope: machine, scenario: restart }
    env:
      REHEARSAL_OLD: ${{ needs.versions.outputs.old }}
      REHEARSAL_NEW: ${{ needs.versions.outputs.new }}
      REHEARSAL_SCOPE: ${{ matrix.scope }}
      REHEARSAL_SCENARIO: ${{ matrix.scenario }}
    steps:
      - run: |
          "REHEARSAL_WORK=$env:RUNNER_TEMP\rehearsal" >> $env:GITHUB_ENV
          "REHEARSAL_OUT=$env:RUNNER_TEMP\rehearsal\out" >> $env:GITHUB_ENV
          git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - uses: actions/download-artifact@v4
        with:
          name: rehearsal-windows-build
          path: ${{ runner.temp }}\rehearsal\releases\v${{ needs.versions.outputs.new }}
      - name: The released installers of the old version
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "v$env:REHEARSAL_OLD" --repo "$env:GITHUB_REPOSITORY" -p latest.yml -p "Fartcrobat-Setup-*" -D "$env:REHEARSAL_WORK\releases\v$env:REHEARSAL_OLD"
      - name: Test certificate, trusted machine-wide on this throwaway runner
        run: |
          node tests/update-rehearsal/make-certs.mjs "$env:REHEARSAL_WORK\tls"
          certutil -addstore -f Root "$env:REHEARSAL_WORK\tls\ca.cer"
      - name: Rehearse the update (${{ matrix.scope }}, ${{ matrix.scenario }})
        run: npx playwright test -c tests/update-rehearsal/playwright.config.ts windows
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rehearsal-windows-${{ matrix.scope }}-${{ matrix.scenario }}
          path: ${{ runner.temp }}\rehearsal\out\
          retention-days: 14
