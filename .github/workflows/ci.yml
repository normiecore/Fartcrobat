name: CI

on:
  push:
    branches: ['**']
  pull_request:

# A newer push to the same branch replaces the run still in progress.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Pull requests from branches of this repository are already tested by their push.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Independent tools the tests use to check the files Fartcrobat writes: pypdf and poppler's
      # pdfsig read signed PDFs, LibreOffice opens exported Word/Excel/PowerPoint files and
      # converts Office files. Without them those checks are skipped, so CI installs them.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - run: pip install -r tests/requirements.txt
      - name: Install poppler-utils and LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils libreoffice-writer libreoffice-calc libreoffice-impress
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: End-to-end tests
        run: xvfb-run -a npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: test-results/
          retention-days: 7
